name: Update Download Links

on:
  release:
    # `published` fires for both new releases and the draft→release
    # transition. `released` overlaps for non-prerelease publishes,
    # which produced duplicate concurrent runs that raced on the
    # `git push` (one would land, the other got `! [rejected]`).
    # `published` alone covers both manual draft-publishing (our flow)
    # and the auto-published case.
    types: [published]
  workflow_dispatch:

# Serialise runs so a future re-trigger or a tag-then-publish ordering
# can't fork two simultaneous attempts to push docs/downloads.json.
concurrency:
  group: update-downloads
  cancel-in-progress: false

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate downloads.json from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Support both release event and manual trigger
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            RELEASE_URL="${{ github.event.release.html_url }}"
          else
            VERSION=$(gh release view --json tagName --jq '.tagName')
            RELEASE_URL=$(gh release view --json url --jq '.url')
          fi
          VERSION_NUM="${VERSION#v}"

          # Fetch all asset download URLs
          ASSETS_JSON=$(gh release view "$VERSION" --json assets \
            --jq '[.assets[] | {name: .name, url: .url}]')

          # Match assets to platform keys by filename pattern
          get_url() {
            echo "$ASSETS_JSON" | jq -r \
              --arg pattern "$1" \
              '[.[] | select(.name | test($pattern))][0].url // ""'
          }

          MACOS_ARM=$(get_url "_aarch64\\.dmg$")
          MACOS_INTEL=$(get_url "_x64\\.dmg$")
          WINDOWS=$(get_url "_x64-setup\\.exe$")
          LINUX_DEB=$(get_url "_amd64\\.deb$")
          LINUX_APPIMAGE=$(get_url "_amd64\\.AppImage$")

          # Write the JSON file
          cat > docs/downloads.json << ENDJSON
          {
            "version": "${VERSION_NUM}",
            "release_url": "${RELEASE_URL}",
            "assets": {
              "macos_arm": "${MACOS_ARM}",
              "macos_intel": "${MACOS_INTEL}",
              "windows": "${WINDOWS}",
              "linux_deb": "${LINUX_DEB}",
              "linux_appimage": "${LINUX_APPIMAGE}"
            }
          }
          ENDJSON

          # Pretty-print with jq
          jq '.' docs/downloads.json > docs/downloads.tmp && mv docs/downloads.tmp docs/downloads.json

          echo "Generated downloads.json for ${VERSION}:"
          cat docs/downloads.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "ci: update download links for ${{ github.event.release.tag_name }}"
          # Rebase-retry on push: if another commit raced in between
          # (concurrent docs PR, etc.), pull --rebase and try again.
          # Bounded to 3 attempts so a real auth / hook failure still
          # surfaces instead of looping forever.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto origin/main and retrying..."
            git pull --rebase origin main
          done
          echo "Push still failing after 3 attempts." >&2
          exit 1
